[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-tracker"
version = "0.1.0"
description = "Terminal UI aggregating Bitcoin buy/sell market trades from major crypto exchanges."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "textual>=0.41",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-benchmark>=4.0",
]

[project.scripts]
btc-tracker = "btc_tracker.core.app:Application.main"

[tool.setuptools.packages.find]
include = ["btc_tracker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
